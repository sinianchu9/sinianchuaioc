version: "3.8"

# AIOC Enterprise Private Deployment
# Usage: docker-compose -f infra/docker-compose/enterprise.private.yml up -d
# Includes Ollama for local LLM (Privacy mode)

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: aioc-ent-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-aioc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aioc_enterprise_2024}
      POSTGRES_DB: ${DB_NAME:-aioc}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../server/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ../../server/migrations/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aioc} -d ${DB_NAME:-aioc}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aioc-ent

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: aioc-ent-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - aioc-ent

  # Ollama for local LLM (Privacy mode)
  ollama:
    image: ollama/ollama:latest
    container_name: aioc-ent-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - aioc-ent

  # API Gateway
  gateway:
    build:
      context: ../../server
      dockerfile: docker/Dockerfile.gateway
    container_name: aioc-ent-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      - AIOC_MODE=production
      - GATEWAY_PORT=8080
      - CORE_PORT=8081
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-aioc}
      - DB_PASSWORD=${DB_PASSWORD:-aioc_enterprise_2024}
      - DB_NAME=${DB_NAME:-aioc}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CORE_SERVICE_URL=http://core:8081
      - CONFIG_PATH=/app/configs/config.yaml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aioc-ent

  # Core Orchestrator
  core:
    build:
      context: ../../server
      dockerfile: docker/Dockerfile.core
    container_name: aioc-ent-core
    ports:
      - "${CORE_PORT:-8081}:8081"
    environment:
      - AIOC_MODE=production
      - CORE_PORT=8081
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-aioc}
      - DB_PASSWORD=${DB_PASSWORD:-aioc_enterprise_2024}
      - DB_NAME=${DB_NAME:-aioc}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
      - CONFIG_PATH=/app/configs/config.yaml
      - ENGINE_PROVIDER=${ENGINE_PROVIDER:-openclaw}
      - ENGINE_URL=http://engine-openclaw:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - aioc-ent

  # OpenClaw Engine Runner (stateless, internal-only)
  engine-openclaw:
    build:
      context: ../../server/engine-openclaw
      dockerfile: Dockerfile
    container_name: aioc-ent-engine-openclaw
    environment:
      - PORT=8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aioc-ent

  # Vector DB (Phase 2: RAG / knowledge retrieval)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aioc-ent-qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    profiles:
      - rag # Only start when --profile rag is passed
    networks:
      - aioc-ent

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  qdrant_data:

networks:
  aioc-ent:
    driver: bridge
