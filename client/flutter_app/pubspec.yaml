name: aioc_client
description: "AIOC - AI Operating Console"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # HTTP & Networking
  http: ^1.2.2
  # Local Storage
  shared_preferences: ^2.3.4
  # Markdown Rendering
  flutter_markdown: ^0.7.6
  # Syntax Highlighting
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  # UUID
  uuid: ^4.5.1
  # Google Fonts
  google_fonts: ^6.2.1
  # URL Launcher
  url_launcher: ^6.3.1
  # Charts
  fl_chart: ^0.70.2
  # File picker for attaching local files into prompts
  file_picker: ^8.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
